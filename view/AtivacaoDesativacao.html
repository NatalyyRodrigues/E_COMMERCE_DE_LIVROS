<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ativação/Inativação de Fornecedor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4">

        <div class="card">

            <div class="card-body">

                <h2 id="tituloTela" class="mb-4">
                    Alterar Status do Fornecedor
                </h2>

                <form id="formStatusFornecedor">

                    <div class="mb-3">

                        <label for="categoria" class="form-label">
                            Categoria *
                        </label>

                        <select
                            class="form-select"
                            id="categoria"
                            required>

                            <option value="">Selecione</option>
                            <option value="Comercial">Comercial</option>
                            <option value="Administrativo">Administrativo</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label for="justificativa" class="form-label">
                            Justificativa *
                        </label>

                        <textarea
                            class="form-control"
                            id="justificativa"
                            rows="4"
                            required></textarea>

                    </div>

                    <fieldset class="border p-3 mb-4">

                        <legend class="float-none w-auto px-2 fs-6">
                            Usuário
                        </legend>

                    </fieldset>

                    <div class="d-flex justify-content-end gap-2">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            id="btnCancelar">
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="btnConfirmar">
                            Confirmar
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="../controller/ativacaoDesativacao.js"></script>

</body>

</html>
