<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Fornecedor</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4 mb-5">

        <h2 class="mb-4">Cadastro de Fornecedor</h2>

        <form id="formFornecedor">

            <!-- DADOS DO FORNECEDOR -->
            <div class="card mb-4">

                <div class="card-header">
                    Dados do Fornecedor
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-2 mb-3">
                            <label for="codigo" class="form-label">
                                Código
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="codigo"
                                disabled>
                        </div>

                        <div class="col-md-5 mb-3">
                            <label for="razaoSocial" class="form-label">
                                Razão Social *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="razaoSocial"
                                maxlength="100"
                                required>
                        </div>

                        <div class="col-md-5 mb-3">
                            <label for="nomeFantasia" class="form-label">
                                Nome Fantasia *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nomeFantasia"
                                maxlength="100"
                                required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label for="cnpj" class="form-label">
                                CNPJ *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="cnpj"
                                maxlength="14"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">
                                E-mail *
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                maxlength="100"
                                required>
                        </div>

                    </div>

                </div>
            </div>


            <!-- TELEFONE -->
            <div class="card mb-4">

                <div class="card-header">
                    Telefone
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="tipoTelefone" class="form-label">
                                Tipo *
                            </label>

                            <select
                                class="form-select"
                                id="tipoTelefone"
                                required>

                                <option value="">Selecione</option>
                                <option value="Comercial">Comercial</option>
                                <option value="Celular">Celular</option>
                                <option value="Residencial">Residencial</option>

                            </select>
                        </div>

                        <div class="col-md-2 mb-3">
                            <label for="ddd" class="form-label">
                                DDD *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="ddd"
                                maxlength="2"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="numeroTelefone" class="form-label">
                                Número *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="numeroTelefone"
                                maxlength="9"
                                required>
                        </div>

                    </div>

                </div>
            </div>


            <!-- ENDEREÇO -->
            <div class="card mb-4">

                <div class="card-header">
                    Endereço
                </div>

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-3 mb-3">
                            <label for="tipoLogradouro" class="form-label">
                                Tipo de Logradouro *
                            </label>

                            <select
                                class="form-select"
                                id="tipoLogradouro"
                                required>

                                <option value="">Selecione</option>
                                <option value="Rua">Rua</option>
                                <option value="Avenida">Avenida</option>
                                <option value="Travessa">Travessa</option>

                            </select>
                        </div>

                        <div class="col-md-7 mb-3">
                            <label for="logradouro" class="form-label">
                                Logradouro *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="logradouro"
                                maxlength="100"
                                required>
                        </div>

                        <div class="col-md-2 mb-3">
                            <label for="numeroEndereco" class="form-label">
                                Número *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="numeroEndereco"
                                maxlength="10"
                                required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="complemento" class="form-label">
                                Complemento
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="complemento"
                                maxlength="50">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="bairro" class="form-label">
                                Bairro *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="bairro"
                                maxlength="50"
                                required>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="cep" class="form-label">
                                CEP *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="cep"
                                maxlength="8"
                                required>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-5 mb-3">
                            <label for="cidade" class="form-label">
                                Cidade *
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="cidade"
                                maxlength="50"
                                required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="estado" class="form-label">
                                Estado *
                            </label>

                            <select
                                class="form-select"
                                id="estado"
                                required>

                                <option value="">Selecione</option>
                                <option value="SP">SP</option>
                                <option value="RJ">RJ</option>
                                <option value="MG">MG</option>
                                <option value="PR">PR</option>

                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="pais" class="form-label">
                                País *
                            </label>

                            <select
                                class="form-select"
                                id="pais"
                                required>

                                <option value="">Selecione</option>
                                <option value="Brasil">Brasil</option>

                            </select>
                        </div>

                    </div>

                </div>
            </div>


            <!-- BOTÕES -->
            <div class="d-flex justify-content-end gap-2">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="btnCancelar">
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="btnSalvar">
                    Salvar
                </button>

            </div>

        </form>

    </div>

    <script src="../controller/cadastroFornecedor.js"></script>

</body>

</html>
