<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedores - E-commerce de Livros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
       fieldset.box-usuario {
            border: 1.5px solid #828080 !important;
            padding: 2px 12px 6px 12px !important;
            margin-top: 15px;
        }
        fieldset.box-usuario legend {
            float: none !important;
            width: auto !important;
            padding: 0 8px !important;
            margin-bottom: 0 !important;
            font-size: 0.95rem !important;
            font-weight: 500;
        }

    </style>
</head>

<body>
    <!-- Tela de Busca (11.1) -->
    <div class="container my-4">
        <section id="ecra-busca" class="card shadow-sm p-2 mb-4">
        <h4 class="card-title border-bottom pb-2">
            Cadastro de Fornecedores </h4>
        
    <form id="FormBusca" action="ResultadoBusca.html">
            <div class="mb-3 row">
                <label for="codigo" class="col-sm-2 col-form-label">Código: </label>
                <div class="col-sm-2">
                    <input type="text" class="form-control" id="codigo" name="codigo" maxlength="10">
                </div>
            </div>
            <div class="mb-3 row">
                <label for="razaoSocial" class="col-sm-2 col-form-label">Razão Social: </label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" id="razaoSocial" name="razao-social" maxlength="100">
                </div>
            </div>
             <div class="mb-3 row">
                <label for="nomeFantasia" class="col-sm-2 col-form-label">Nome Fantasia: </label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" id="nomeFantasia" name="nome-fantasia" maxlength="60">
                </div>
            </div>
             <div class="mb-3 row">
                <label for="CNPJ" class="col-sm-2 col-form-label">CNPJ: </label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="CNPJ" name="cnpj" maxlength="18">
                </div>
            </div>
            <div class="mb-3 row">
                <label for="cidade" class="col-sm-2 col-form-label">Cidade: </label>
                <div class="col-sm-3">
                    <input type="text" class="form-control" id="cidade" name="cidade" maxlength="60">
                </div>
                <label for="estado" class="col-sm-1 col-form-label">Estado: </label>
                <div class="col-sm-2">
                    <select class="form-select" id="estado" name="estado">
                         <option selected> </option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                    </select>
                </div>
                </div>

            <div class="mb-3 row">
                <label for="status" class="col-sm-2 col-form-label">Status: </label>
                    <div class="col-sm-3">
                        <select class="form-select" id="status">
                            <option value="todos" selected> Todos </option>
                            <option value="ativo" > Ativo </option>
                            <option value="inativo" > Inativo </option>
                            
                        </select>
                     </div>
                    

                     <div class="col-sm-5">
                        <div class="text-center">
                        <button type="submit" class="btn btn-secondary">
                            Buscar
                        </button>
                    </div>
            </div>
            <fieldset class="box-usuario">
                    <legend>Usuário</legend>
                    <div class="py-1">
                        <span id="usuarioLogado"></span>
                    </div>
                </fieldset>
            
            <!--Borda inferior de cadastro-->
            
    </form>

    <div class="card-footer footer-prototipo"></div>
    </section>
    </div>
    
    <!--vinvulando a lógica da busc dos dados mockados do formulario -->
    <script src="../controller/buscaFornecedor.js"></script>
</body>
</html>
